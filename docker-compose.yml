services:
  db:
    image: postgis/postgis:16-3.4
    container_name: pinfood-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinfood
      POSTGRES_PASSWORD: pinfood
      POSTGRES_DB: pinfood
    volumes:
      - pinfood-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinfood -d pinfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backendFastApi
    container_name: pinfood-backend
    restart: unless-stopped
    env_file:
      - path: ./backendFastApi/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://pinfood:pinfood@db:5432/pinfood
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pinfood-db-data:
