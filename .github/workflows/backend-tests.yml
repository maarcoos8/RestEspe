name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backendFastApi/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backendFastApi/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backendFastApi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backendFastApi/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
